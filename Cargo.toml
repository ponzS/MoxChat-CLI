[package]
name = "moxchat-cli"
version = "0.1.1"
edition = "2021"
publish = false
description = "Encrypted MoxChat terminal client and local AI runtime"

[[bin]]
name = "mox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "string"] }
directories = "6"
fs2 = "0.4"
flate2 = "1"
hex = "0.4"
hkdf = "0.12"
mime_guess = "2"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.1"
semver = "1"
sha2 = "0.10"
shell-words = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tar = "0.4"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
dbus = { version = "0.9", features = ["vendored"] }

[profile.dev]
debug = 0
incremental = false

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
